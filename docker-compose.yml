services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - >
        /bin/ollama serve &
        pid=$$!;
        trap 'kill -TERM $$pid; wait $$pid' TERM INT;
        until /bin/ollama list > /dev/null 2>&1; do sleep 1; done;
        /bin/ollama list | grep -q "llama3.2:1b" || /bin/ollama pull llama3.2:1b;
        echo "Ollama model llama3.2:1b is ready.";
        wait $$pid

  search-server:
    build: ./search-server
    container_name: search-server
    ports:
      - "8080:8080"
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - SEARCH_DATASET_PATH=/app/data/batched
      - JAVA_TOOL_OPTIONS=-Xmx6g
    volumes:
      - ./data/batched:/app/data/batched

volumes:
  ollama-data:


